name: cd

on:
  workflow_dispatch:
    inputs:
      npm:
        description: 'package (eg: gly-types)'
        required: false
        type: string
  push:
    tags:
      - "*.*.*"

permissions:
  id-token: write
  contents: read

jobs:
  auto:
    if: github.event_name == 'push' || inputs.npm == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['gly-cli', 'gly-engine', 'gly-engine-lite', 'gly-engine-micro', 'gly-engine-nano']
    steps:
      -
        uses: actions/checkout@v4
      -
        uses: actions/setup-node@v2
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      -
        run: npm install -g npm@latest
      -
        run: npm config set allow-git true
      -
        if: matrix.package != 'gly-cli'
        working-directory: ./npm/${{ matrix.package }}
        run: npm run build
      -
        if: matrix.package == 'gly-cli'
        run: ./cli.js cli build
      -
        working-directory: ./dist
        run: npm publish

  manual:
    if: inputs.npm != ''
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.npm }}
    steps:
      -
        uses: actions/checkout@v4
      -
        uses: actions/setup-node@v2
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      -
        run: npm install -g npm@latest
      -
        run: npm config set allow-git true
      -
        if: inputs.npm != 'gly-cli'
        working-directory: ./npm/${{ inputs.npm }}
        run: npm run build --if-present
      -
        if: inputs.npm == 'gly-cli'
        run: ./cli.js cli build
      -
        run: cd dist 2>/dev/null || cd "npm/$PACKAGE" && npm publish
